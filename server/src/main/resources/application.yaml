# 서버 설정은 전부 환경변수로 받습니다 (docs/contracts/config.md, D12).
# 필수값(DB_*, JWT_SECRET, CORS_ALLOWED_ORIGINS)이 없거나 JWT_SECRET이 32바이트 미만이면 서버가 시작하지 않습니다.
spring:
  application:
    name: autolog-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

autolog:
  jwt:
    # 관리자 JWT HS256 서명 키 (32바이트 이상)
    secret: ${JWT_SECRET:}
    expires-hours: ${JWT_EXPIRES_HOURS:12}
  cors:
    # 쉼표 구분 (D8)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # 현재 동의 문서 버전 (D13)
  consent-version: ${CONSENT_VERSION:2026-11-01}
  # 네 값(org-name, biz-reg-no, admin-login-id, admin-password)이 모두 있을 때만 시드합니다.
  seed:
    org-name: ${SEED_ORG_NAME:}
    biz-reg-no: ${SEED_BIZ_REG_NO:}
    admin-login-id: ${SEED_ADMIN_LOGIN_ID:}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    admin-display-name: ${SEED_ADMIN_DISPLAY_NAME:관리자}
