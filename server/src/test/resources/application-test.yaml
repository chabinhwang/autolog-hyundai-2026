# 자동 테스트용. DB는 Testcontainers PostgreSQL(@ServiceConnection)이 연결합니다.
# AUTOLOG_TEST_DB_URL이 있으면 컨테이너 대신 그 DB를 씁니다 (Docker 없는 로컬: .local/test-postgres.sh test).
spring:
  datasource:
    url: ${AUTOLOG_TEST_DB_URL:}
    username: ${AUTOLOG_TEST_DB_USERNAME:}
    password: ${AUTOLOG_TEST_DB_PASSWORD:}
autolog:
  jwt:
    secret: test-only-jwt-secret-must-be-at-least-32-bytes
  cors:
    allowed-origins: http://localhost:5173,https://dashboard.example.test
  consent-version: 2026-11-01
  seed:
    org-name: 시드 주식회사
    biz-reg-no: 999-99-99999
    admin-login-id: seed-admin@autolog-test.kr
    admin-password: seed-password-1234
    admin-display-name: 시드관리자
